[theme]
name = "one-dark"

# Herdr owns the inner panes; WezTerm uses Ctrl+G as its prefix.
# Keep the default prefix bindings alongside direct Alt shortcuts.
[keys]
prefix = "ctrl+b"
split_vertical = 'prefix+\'
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]
swap_pane_left = ["prefix+shift+h", "ctrl+alt+shift+left"]
swap_pane_down = ["prefix+shift+j", "ctrl+alt+shift+down"]
swap_pane_up = ["prefix+shift+k", "ctrl+alt+shift+up"]
swap_pane_right = ["prefix+shift+l", "ctrl+alt+shift+right"]
zoom = ["prefix+z", "alt+z"]
resize_pane_left = "alt+shift+left"
resize_pane_down = "alt+shift+down"
resize_pane_up = "alt+shift+up"
resize_pane_right = "alt+shift+right"
previous_tab = "ctrl+alt+left"
next_tab = "ctrl+alt+right"
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"

# Windows command; on WSL replace command with:
# python3 "$HOME/.config/herdr/herdr-move-pane.py"
[[keys.command]]
key = "prefix+m"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-move-pane.ps1"'
description = "move pane to tab"
width = "70%"
height = "70%"

# Show current tab ID and draw its panes by layout; read-only. WSL: replace command with:
# python3 "$HOME/.config/herdr/herdr-list-ids.py"
[[keys.command]]
key = "prefix+i"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-list-ids.ps1"'
description = "show current tab pane layout"
width = "35%"
height = "35%"

# Plugin keys. Windows binds the `-windows` action ids; on WSL drop the
# `-windows` suffix from each command.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-windows"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab-windows"
description = "open file viewer in tab"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects-windows"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions-windows"
description = "herdr-plus: quick actions"
