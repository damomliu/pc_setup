[theme]
name = "one-dark"

# Ctrl+B, C 直接新增 tab，不詢問名稱（交給 Auto Title 命名）。
[ui]
prompt_new_tab_name = false

# Herdr owns the inner panes; WezTerm uses Ctrl+G as its prefix.
# Keep the default prefix bindings alongside direct Alt shortcuts.
[keys]
prefix = "ctrl+b"
split_vertical = 'prefix+\'
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]
swap_pane_left = ["prefix+shift+h", "ctrl+alt+shift+left"]
swap_pane_down = ["prefix+shift+j", "ctrl+alt+shift+down"]
swap_pane_up = ["prefix+shift+k", "ctrl+alt+shift+up"]
swap_pane_right = ["prefix+shift+l", "ctrl+alt+shift+right"]
zoom = ["prefix+z", "alt+z"]
resize_pane_left = "alt+shift+left"
resize_pane_down = "alt+shift+down"
resize_pane_up = "alt+shift+up"
resize_pane_right = "alt+shift+right"
previous_tab = "ctrl+alt+left"
next_tab = "ctrl+alt+right"
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"
last_pane = "prefix+;"

# Windows command; on WSL replace command with:
# python3 "$HOME/.config/herdr/herdr-move-pane.py"
[[keys.command]]
key = "prefix+m"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-move-pane.ps1"'
description = "move pane to tab"
width = 58
height = 16

# WSL: python3 "$HOME/.config/herdr/herdr-move-pane.py" workspace
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-move-pane.ps1" -Mode workspace'
description = "move pane to workspace"
width = 54
height = 16

# Show current tab ID and draw its panes by layout; read-only. WSL: replace command with:
# python3 "$HOME/.config/herdr/herdr-list-ids.py"
[[keys.command]]
key = "prefix+i"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-list-ids.ps1"'
description = "show current tab pane layout"
width = "35%"
height = "35%"

# Show Claude/Codex usage bars via quota-cli (~/.cargo/bin). WSL: replace command with:
# python3 "$HOME/.config/herdr/herdr-usage.py"
[[keys.command]]
key = "prefix+u"
type = "popup"
command = 'python "%APPDATA%\herdr\herdr-usage.py"'
description = "show Claude/Codex usage"
width = "60%"
height = 12

# Open Yazi in a right split: local cwd, or (when the focused pane runs ssh) the host's / via sshfs.
# WSL: python3 "$HOME/.config/herdr/herdr-sshfs.py" open --default-path /opt/aiont-vibration-monitoring
[[keys.command]]
key = "prefix+y"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-sshfs.ps1" -DefaultPath /opt/aiont-vibration-monitoring'
description = "open yazi (local or sshfs remote)"
width = "50%"
height = "25%"

# Same as prefix+y, but opens Yazi in a new tab of the current workspace.
# WSL: python3 "$HOME/.config/herdr/herdr-sshfs.py" open --tab --default-path /opt/aiont-vibration-monitoring
[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-sshfs.ps1" -DefaultPath /opt/aiont-vibration-monitoring -Target tab'
description = "open yazi in tab (local or sshfs remote)"
width = "50%"
height = "25%"

# Pick an existing sshfs mount and unmount it. WSL: python3 "$HOME/.config/herdr/herdr-sshfs.py" unmount
[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-sshfs.ps1" -Mode unmount'
description = "sshfs unmount"
width = "50%"
height = "25%"

# Open git-graph-tui (ggt) in a new tab for the focused pane's repo; quitting ggt closes the tab.
# WSL: use the upstream plugin (allient/git-graph-tui/integrations/herdr) instead:
#   type = "plugin_action", command = "git-graph-tui.open" (drop width/height)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = 'powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%APPDATA%\herdr\herdr-git-graph.ps1"'
description = "open git graph"
width = "50%"
height = "25%"

# Plugin keys. Windows binds the `-windows` action ids; on WSL drop the
# `-windows` suffix from each command.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-windows"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab-windows"
description = "open file viewer in tab"

# Windows only: the server runs elevated (auto-started via sshd/WMI), so let the
# ordinary WezTerm process query it directly. Takes effect after a server restart.
[server]
allow_unelevated_clients = true
