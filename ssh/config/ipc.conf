# 聯亞 IPC (空壓機、ACD)
Host hsp-16a
  HostName hsp3-2611
Host uigc-14p4a
  HostName u14p4a-2611

Host uigc* u14p* ctky* ctsp* hsp* stsp* efco*
  User tkk

# Adlink 裝置
Host adlink
  HostName 192.168.15.108
  User tkk

# 連線：ssh -N adlink-web
# 瀏覽請用 http://127.0.0.1:16901（登入 API 會打 127.0.0.1:6166, 一次只能轉發一台裝置）
Host adlink-web
  HostName 192.168.15.108
  User tkk
  LocalForward 16901 169.254.1.3:80
  LocalForward 6166 169.254.1.3:6166
