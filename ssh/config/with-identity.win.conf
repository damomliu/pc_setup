# Ollama API（經 SSH 轉發）
# 前景：ssh -N ollama          （Ctrl+C 停止）
# 背景：ssh -fN ollama         （Win OpenSSH 可用）
# 本機：http://127.0.0.1:11434
# 停止背景轉發（PowerShell）：
#   Get-CimInstance Win32_Process -Filter "name='ssh.exe'" |  Where-Object { $_.CommandLine -match 'ollama' } | ForEach-Object { Stop-Process -Id $_.ProcessId }
Host ollama
  HostName 192.168.17.57
  User nexense
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
  ExitOnForwardFailure yes
  LocalForward 11434 127.0.0.1:11434
